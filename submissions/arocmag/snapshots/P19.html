    <script>
        var invalidClass = "is-invalid";
        $(document).ready(function () {
            $('#username,#password,#verifycode').bind('keyup', function () {
                if ($(this).val() != "") {
                    $(this).removeClass(invalidClass);
                }
            });
            $('#resetBtn').bind('click', function () {
                $('#username,#password,#verifycode').val("").removeClass(invalidClass);
                $('#validmsg').fadeOut(function () { $(this).html(""); });
                $('#certId').focus();
            });
        });
        function checkForm() {
            var userName = $('#username');
            var password = $('#password');
            var verifyCode = $('#verifycode');
            var rslt = true;
            var msg = "";
            if (verifyCode.val() == "") {
                verifyCode.addClass(invalidClass).focus();
                msg = "请输入验证码";
                rslt = rslt && false;
            }
            if (password.val() == "") {
                password.addClass(invalidClass).focus();
                msg = "请输入密码";
                rslt = rslt && false;
            }
            if (userName.val() == "") {
                userName.addClass(invalidClass).focus();
                msg = "请输入用户名";
                rslt = rslt && false;
            }
            if (rslt == false) {
                $('#validmsg').hide(function () { $(this).html(msg).removeClass('d-none').fadeIn() });
            }
            return rslt;
        }
    </script>
