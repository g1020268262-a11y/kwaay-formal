<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222222"/></marker></defs>
<text x="55" y="70" text-anchor="start" font-family="Microsoft YaHei" font-size="32" font-weight="bold" fill="#111111">K-Waay源接口（一次BatchReceive调用）</text>
<rect x="90" y="120" width="380" height="140" rx="12" fill="#eef3f6" stroke="#333333" stroke-width="3"/>
<text x="280.0" y="178" text-anchor="middle" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#111111">位置 ℓ=1；参与方索引 j_1</text>
<text x="280.0" y="232" text-anchor="middle" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#111111">(pk_j1, prek_j1, m_j1)</text>
<rect x="730" y="120" width="380" height="140" rx="12" fill="#eef3f6" stroke="#333333" stroke-width="3"/>
<text x="920.0" y="178" text-anchor="middle" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#111111">位置 ℓ=2；参与方索引 j_2</text>
<text x="920.0" y="232" text-anchor="middle" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#111111">(pk_j2, prek_j2, m_j2)</text>
<rect x="350" y="330" width="500" height="150" rx="18" fill="#ffffff" stroke="#111111" stroke-width="3"/>
<text x="600" y="385" text-anchor="middle" font-family="Microsoft YaHei" font-size="28" font-weight="normal" fill="#111111">BatchReceive(sk_i, st_i, S)</text>
<text x="600" y="435" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#111111">共享接收方状态；逐分量输出 k_j</text>
<line x1="280" y1="260" x2="470" y2="330" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="920" y1="260" x2="730" y2="330" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="470" y1="480" x2="280" y2="500" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="730" y1="480" x2="920" y2="500" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
<text x="160" y="530" text-anchor="start" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#111111">输出 k_j1</text>
<text x="850" y="530" text-anchor="start" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#111111">输出 k_j2</text>
<rect x="155" y="555" width="890" height="70" rx="12" fill="#f2f2f2" stroke="#555555" stroke-width="3"/>
<text x="600" y="600" text-anchor="middle" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#111111">j_1 ≠ j_2：原规范规定同一调用中的输入对应不同参与方</text>
<line x1="600" y1="625" x2="600" y2="715" stroke="#222222" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="12 8"/>
<text x="600" y="682" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#111111">分析投影（不表示已建立 refinement）</text>
<text x="55" y="752" text-anchor="start" font-family="Microsoft YaHei" font-size="32" font-weight="bold" fill="#111111">固定两槽接纳抽象</text>
<rect x="90" y="795" width="430" height="110" rx="16" fill="#e9eef1" stroke="#222222" stroke-width="3"/>
<text x="305.0" y="865" text-anchor="middle" font-family="Microsoft YaHei" font-size="28" font-weight="normal" fill="#111111">E_1=(A_1, oid_1, m_1)</text>
<rect x="680" y="795" width="430" height="110" rx="16" fill="#e9eef1" stroke="#222222" stroke-width="3"/>
<text x="895.0" y="865" text-anchor="middle" font-family="Microsoft YaHei" font-size="28" font-weight="normal" fill="#111111">E_2=(A_2, oid_2, m_2)</text>
<rect x="390" y="940" width="420" height="60" rx="14" fill="#ffffff" stroke="#444444" stroke-width="3"/>
<text x="600" y="979" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#111111">共享批次/接收方上下文 (bid, rst)</text>
<line x1="305" y1="905" x2="480" y2="940" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="895" y1="905" x2="720" y2="940" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
</svg>