<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222222"/></marker></defs>
<text x="55" y="70" text-anchor="start" font-family="Microsoft YaHei" font-size="32" font-weight="bold" fill="#111111">同一精确来源在宽松接纳模型中的两次接受</text>
<rect x="135" y="105" width="930" height="100" rx="16" fill="#eef3f6" stroke="#222222" stroke-width="3"/>
<text x="600" y="150" text-anchor="middle" font-family="Microsoft YaHei" font-size="28" font-weight="normal" fill="#111111">SendMessage at s：Send(A, oid, m)</text>
<text x="600" y="190" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#111111">公开 E=(A, oid, m)；该精确三元组只有一个匹配 Send</text>
<line x1="600" y1="205" x2="600" y2="285" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="100" y="285" width="410" height="105" rx="12" fill="#f7f7f7" stroke="#333333" stroke-width="3"/>
<rect x="690" y="285" width="410" height="105" rx="12" fill="#f7f7f7" stroke="#333333" stroke-width="3"/>
<text x="305" y="350" text-anchor="middle" font-family="Microsoft YaHei" font-size="28" font-weight="normal" fill="#111111">Slot 1 = E</text>
<text x="895" y="350" text-anchor="middle" font-family="Microsoft YaHei" font-size="28" font-weight="normal" fill="#111111">Slot 2 = E</text>
<line x1="600" y1="245" x2="305" y2="285" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="600" y1="245" x2="895" y2="285" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="250" y="465" width="700" height="115" rx="16" fill="#ececec" stroke="#111111" stroke-width="3"/>
<text x="600" y="515" text-anchor="middle" font-family="Microsoft YaHei" font-size="28" font-weight="normal" fill="#111111">AdmitRelaxedBatch at b</text>
<text x="600" y="558" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#111111">BatchReceive(bid, rst)；无 A/m 不等条件</text>
<line x1="305" y1="390" x2="500" y2="465" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="895" y1="390" x2="700" y2="465" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="120" y="665" width="960" height="95" rx="12" fill="#f5f5f5" stroke="#333333" stroke-width="3"/>
<text x="600" y="720" text-anchor="middle" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#111111">ProcessSlot1 at r_1 → ReceiverAccept(A, oid, m, bid, rst)</text>
<rect x="120" y="835" width="960" height="95" rx="12" fill="#f5f5f5" stroke="#333333" stroke-width="3"/>
<text x="600" y="890" text-anchor="middle" font-family="Microsoft YaHei" font-size="24" font-weight="normal" fill="#111111">ProcessSlot2 at r_2 → ReceiverAccept(A, oid, m, bid, rst)</text>
<line x1="600" y1="580" x2="600" y2="665" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="600" y1="760" x2="600" y2="835" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="100" y="990" width="1000" height="80" rx="14" fill="#ffffff" stroke="#555555" stroke-width="3"/>
<text x="600" y="1042" text-anchor="middle" font-family="Microsoft YaHei" font-size="28" font-weight="normal" fill="#111111">同一 (bid, rst)，且 s &lt; b &lt; r_1 &lt; r_2</text>
<line x1="600" y1="930" x2="600" y2="990" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="20" y="480" width="200" height="420" rx="15" fill="#ffffff" stroke="#777777" stroke-width="3"/>
<text x="120" y="530" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#111111">持久来源事实</text>
<text x="120" y="575" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" font-weight="normal" fill="#111111">!Sent(A,oid,m)</text>
<line x1="220" y1="650" x2="360" y2="705" stroke="#555555" stroke-width="4" stroke-dasharray="10 7"/>
<line x1="220" y1="700" x2="360" y2="880" stroke="#555555" stroke-width="4" stroke-dasharray="10 7"/>
<text x="30" y="1130" text-anchor="start" font-family="Microsoft YaHei" font-size="20" font-weight="normal" fill="#111111">虚线表示两个处理规则读取同一持久来源事实，不表示发生第二次发送。</text>
</svg>